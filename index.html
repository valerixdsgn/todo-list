<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f4f4f2;
            --surface: #ffffff;
            --text: #171717;
            --secondary: #737373;
            --border: #e5e5e5;
            --danger: #dc2626;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 80px 20px;
            background: var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .todo-app {
            width: 100%;
            max-width: 680px;
            padding: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
        }

        .todo-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin-bottom: 7px;
            color: var(--secondary);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 36px;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .counter {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--secondary);
            font-size: 14px;
        }

        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .todo-input {
            flex: 1;
            min-width: 0;
            padding: 15px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #fafafa;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s, background 0.2s;
        }

        .todo-input:focus {
            border-color: #a3a3a3;
            background: #ffffff;
        }

        .todo-input::placeholder {
            color: #a3a3a3;
        }

        .add-button {
            flex-shrink: 0;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: var(--text);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .add-button:hover {
            opacity: 0.85;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
            padding: 10px 12px 10px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #ffffff;
            transition: background 0.2s, border-color 0.2s;
        }

        .todo-item:hover {
            background: #fafafa;
        }

        .todo-checkbox {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--text);
        }

        .todo-text {
            flex: 1;
            min-width: 0;
            color: var(--text);
            font-size: 15px;
            line-height: 1.4;
            overflow-wrap: anywhere;
            transition: color 0.2s;
        }

        .todo-item.completed .todo-text {
            color: #a3a3a3;
            text-decoration: line-through;
        }

        .delete-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #a3a3a3;
            font-family: inherit;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .delete-button:hover {
            background: #f0f0f0;
            color: var(--danger);
        }

        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--secondary);
        }

        .empty-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #f0f0f0;
            color: #525252;
            font-size: 20px;
        }

        .empty-state h2 {
            margin-bottom: 7px;
            color: var(--text);
            font-size: 17px;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .todo-app {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .todo-header {
                align-items: center;
            }

            h1 {
                font-size: 28px;
            }

            .todo-form {
                flex-direction: column;
            }

            .add-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="todo-app">
        <header class="todo-header">
            <div>
                <p class="eyebrow">План на сегодня</p>
                <h1>Мои задачи</h1>
            </div>

            <div class="counter" aria-label="Количество выполненных задач">
                <span id="completedCount">0</span>
                /
                <span id="totalCount">0</span>
            </div>
        </header>

        <form class="todo-form" id="todoForm">
            <input
                class="todo-input"
                type="text"
                id="todoInput"
                placeholder="Добавить новую задачу..."
                maxlength="150"
                autocomplete="off"
                aria-label="Новая задача"
            >

            <button class="add-button" type="submit">
                Добавить
            </button>
        </form>

        <section>
            <ul class="todo-list" id="todoList" aria-live="polite"></ul>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">✓</div>
                <h2>Задач пока нет</h2>
                <p>Добавьте первую задачу, чтобы начать работу.</p>
            </div>
        </section>
    </main>

    <script>
        const todoForm = document.getElementById("todoForm");
        const todoInput = document.getElementById("todoInput");
        const todoList = document.getElementById("todoList");
        const emptyState = document.getElementById("emptyState");
        const totalCount = document.getElementById("totalCount");
        const completedCount = document.getElementById("completedCount");

        let todos = JSON.parse(localStorage.getItem("todos")) || [];

        function saveTodos() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }

        function updateCounter() {
            const completed = todos.filter(todo => todo.completed).length;
            totalCount.textContent = todos.length;
            completedCount.textContent = completed;
        }

        function renderTodos() {
            todoList.innerHTML = "";
            updateCounter();

            if (todos.length === 0) {
                emptyState.style.display = "block";
                return;
            }

            emptyState.style.display = "none";

            todos.forEach(todo => {
                const li = document.createElement("li");
                li.className = "todo-item";

                if (todo.completed) {
                    li.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "todo-checkbox";
                checkbox.checked = todo.completed;
                checkbox.dataset.id = todo.id;
                checkbox.setAttribute(
                    "aria-label",
                    "Отметить задачу как выполненную"
                );

                const text = document.createElement("span");
                text.className = "todo-text";
                text.textContent = todo.text;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-button";
                deleteButton.textContent = "×";
                deleteButton.dataset.id = todo.id;
                deleteButton.setAttribute(
                    "aria-label",
                    "Удалить задачу"
                );

                li.appendChild(checkbox);
                li.appendChild(text);
                li.appendChild(deleteButton);
                todoList.appendChild(li);
            });
        }

        todoForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = todoInput.value.trim();

            if (!text) {
                todoInput.focus();
                return;
            }

            todos.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            saveTodos();
            renderTodos();

            todoInput.value = "";
            todoInput.focus();
        });

        todoList.addEventListener("change", function(event) {
            if (!event.target.classList.contains("todo-checkbox")) {
                return;
            }

            const id = Number(event.target.dataset.id);

            todos = todos.map(todo => {
                if (todo.id === id) {
                    return {
                        ...todo,
                        completed: event.target.checked
                    };
                }

                return todo;
            });

            saveTodos();
            renderTodos();
        });

        todoList.addEventListener("click", function(event) {
            if (!event.target.classList.contains("delete-button")) {
                return;
            }

            const id = Number(event.target.dataset.id);

            todos = todos.filter(todo => todo.id !== id);

            saveTodos();
            renderTodos();
        });

        renderTodos();
    </script>
</body>
</html>
